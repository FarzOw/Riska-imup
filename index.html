<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khusus untuk Rika</title>

<style>
  body {
    margin: 0;
    background: #ffe6f0;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* 🌸 Bunga Jatuh */
  .flower {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: fall linear infinite;
    opacity: 0.8;
    pointer-events: none;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10px) rotate(0deg);
    }
    100% {
      transform: translateY(110vh) rotate(360deg);
    }
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 360px;
    margin: auto;
    text-align: center;
    padding: 30px 15px;
  }

  /* ===== Karakter ===== */
  .character {
    width: 160px;
    height: 160px;
    background: #ffb6c1;
    border-radius: 50%;
    margin: auto;
    position: relative;
    animation: float 2s ease-in-out infinite;
  }

  .eye {
    width: 18px;
    height: 18px;
    background: #000;
    border-radius: 50%;
    position: absolute;
    top: 55px;
    animation: blink 4s infinite;
  }

  .eye.left { left: 45px; }
  .eye.right { right: 45px; }

  .mouth {
    width: 40px;
    height: 20px;
    border-bottom: 4px solid #333;
    border-radius: 0 0 40px 40px;
    position: absolute;
    bottom: 40px;
    left: 60px;
    transition: all 0.3s;
  }

  .character.happy .mouth {
    width: 50px;
    left: 55px;
    border-bottom: 6px solid #333;
  }

  @keyframes blink {
    0%,95%,100% { height: 18px; }
    96%,99% { height: 3px; }
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  #text {
    font-size: 20px;
    min-height: 50px;
    margin: 20px 0 10px;
  }

  .heart {
    font-size: 45px;
    animation: beat 1s infinite;
  }

  @keyframes beat {
    50% { transform: scale(1.2); }
  }

  button {
    margin-top: 20px;
    padding: 12px 24px;
    border-radius: 25px;
    border: none;
    background: #ff5c8a;
    color: white;
    font-size: 16px;
    cursor: pointer;
    width: 100%;
  }

  button:hover {
    background: #ff2f6d;
  }
</style>
</head>

<body>

<div class="container">
  <div class="character" id="char">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>

  <div id="text"></div>
  <div class="heart">❤️</div>

  <button onclick="maafin()">Halo rizka imup 🙇‍♂️</button>

  <audio id="sound" src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Ja-gomen_nasai.ogg"></audio>
</div>

<script>
  /* 🌸 Generate bunga */
  function createFlower() {
    const flower = document.createElement("div");
    flower.classList.add("flower");
    flower.innerText = "🌸";
    flower.style.left = Math.random() * 100 + "vw";
    flower.style.animationDuration = (5 + Math.random() * 5) + "s";
    flower.style.fontSize = (16 + Math.random() * 14) + "px";
    document.body.appendChild(flower);

    setTimeout(() => {
      flower.remove();
    }, 10000);
  }

  setInterval(createFlower, 400);

  /* Typing effect */
  const texts = [
    "ごめんなさい… 🙇‍♂️",
    "Halo Rizka imup...",
    "Kok cantik banget"
  ];

  let textIndex = 0;
  let charIndex = 0;
  let isDeleting = false;

  function typingLoop() {
    const current = texts[textIndex];
    const display = document.getElementById("text");

    if (!isDeleting) {
      display.innerText = current.substring(0, charIndex++);
      if (charIndex > current.length) {
        setTimeout(() => isDeleting = true, 1200);
      }
    } else {
      display.innerText = current.substring(0, charIndex--);
      if (charIndex < 0) {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
      }
    }
    setTimeout(typingLoop, 80);
  }

  typingLoop();

  function maafin() {
    document.getElementById("char").classList.add("happy");
    document.getElementById("text").innerText = "ありがとう 😄";
    document.querySelector(".heart").innerText = "😊😊";
    document.getElementById("sound").play();
  }
</script>

</body>
</html>
